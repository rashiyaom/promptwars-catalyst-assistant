name: Verify submission
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          MOCK_MODE: 'true'
          VITE_MOCK_MODE: 'true'
      - name: Verify tracked source size
        run: node scripts/check-repository.mjs
