<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e2f56b" />
    <meta
      name="description"
      content="Bilingual (English and Hindi) elder-first medication coordination and care workspace with responsible AI guardrails, Beers Criteria polypharmacy checks, and accessible companion assistance."
    />
    <title>Sanjeevani × Taus — Independent living, one conversation at a time</title>
  </head>
  <body>
    <div id="root">
      <noscript>
        <div
          style="
            font-family: system-ui, sans-serif;
            padding: 2rem;
            max-width: 720px;
            margin: 0 auto;
            line-height: 1.6;
          "
        >
          <h1 style="color: #2e4414">Sanjeevani × Taus</h1>
          <p><strong>Independent living, one conversation at a time.</strong></p>
          <p>
            An elder-first medication coordination platform built in English and Hindi (हिन्दी)
            featuring:
          </p>
          <ul>
            <li>
              <strong>Geriatric Polypharmacy & Drug-Drug Interaction Safety:</strong> Real-time
              clinical Beers Criteria and STOPP/START interaction screening.
            </li>
            <li>
              <strong>Prescription Intake:</strong> Multimodal photo prescription digitization and
              bilingual voice intake with human confirmation.
            </li>
            <li>
              <strong>Pill Strip Label Verification:</strong> Package inspection with
              brand-to-generic salt matching and high-visibility mismatch warnings.
            </li>
            <li>
              <strong>Taus Care PAL:</strong> Bounded, consent-driven companion grounded in the
              elder's daily routine.
            </li>
            <li>
              <strong>Elder Accessibility:</strong> WCAG 2.1 AA compliant with 48px touch targets,
              visible focus indicators, and high contrast.
            </li>
          </ul>
          <p>
            <em
              >JavaScript is required to interact with the live care workspace and conversational
              companion.</em
            >
          </p>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
